name: Build APK debug

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Mostra struttura repo (debug)
        run: pwd; ls -la; ls -la app 2>&1 | head -30

      - name: Diagnostica file Gradle
        run: |
          echo "=== settings.gradle.kts ==="; cat settings.gradle.kts
          echo "=== build.gradle.kts ==="; cat build.gradle.kts
          echo "=== app/build.gradle.kts (prime 40 righe) ==="; head -40 app/build.gradle.kts

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Installa Android SDK platform 34
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -5
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle 8.7 (no cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          cache-disabled: true

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
